services:
  # 1. MCP Server
  frappe-mcp-server:
    build:
      context: ./frappe-mcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8080}:8080"
    environment:
      FRAPPE_BASE_URL: ${FRAPPE_BASE_URL:-http://erpnext:8000}
      FRAPPE_API_KEY: ${FRAPPE_API_KEY}
      FRAPPE_API_SECRET: ${FRAPPE_API_SECRET}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - frappe-ai-network
    volumes:
      - ./frappe-mcp-server/config.yaml.example:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. AI Agent
  frappe-ai-agent:
    build:
      context: ./frappe-ai-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-8484}:8484"
    environment:
      AI_AGENT_MCP_SERVER_URL: http://frappe-mcp-server:8080/mcp
      AI_AGENT_FRAPPE_URL: http://erpnext:8000
      MCP_SERVER_URL: http://frappe-mcp-server:8080/mcp
      AI_AGENT_LLM_PROVIDER: ${AI_AGENT_LLM_PROVIDER:-ollama}
      AI_AGENT_LLM_BASE_URL: ${AI_AGENT_LLM_BASE_URL:-http://ollama:11434}
      AI_AGENT_LLM_MODEL: ${AI_AGENT_LLM_MODEL:-qwen3.5:9b}
      AI_AGENT_LLM_API_KEY: ${AI_AGENT_LLM_API_KEY:-}
      # The agent's own web_search / fetch_web_page tools read the SearXNG below. Set the
      # provider to `off` to run without web access, or to `brave` / `tavily` with a key.
      AI_AGENT_WEB_SEARCH_PROVIDER: ${AI_AGENT_WEB_SEARCH_PROVIDER:-searxng}
      AI_AGENT_WEB_SEARCH_URL: ${AI_AGENT_WEB_SEARCH_URL:-http://searxng:8080}
      AI_AGENT_WEB_SEARCH_API_KEY: ${AI_AGENT_WEB_SEARCH_API_KEY:-}
    networks:
      - frappe-ai-network
    depends_on:
      - frappe-mcp-server
      - searxng

  # 2b. SearXNG — self-hosted, keyless web search for the agent. Not published on a host
  # port: only the agent talks to it, over the compose network.
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - frappe-ai-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 3. Ollama (Optional, for Local LLM inference)
  ollama:
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    profiles:
      - full-stack
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_ORIGINS: "*"
    networks:
      - frappe-ai-network
    volumes:
      - ollama_data:/root/.ollama

  # 4. Frappe / ERPNext Site (from Frappista SNE project)
  erpnext:
    image: docker.io/vyogo/erpnext:sne-version-16
    restart: unless-stopped
    ports:
      - "${ERPNEXT_PORT:-8000}:8000"
    environment:
      SITES: erpnext.local
      SITE_NAME: erpnext.local
      ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD:-admin}
      DEVELOPER_MODE: ${ERPNEXT_DEV_MODE:-1}
    volumes:
      - erpnext_data:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
      # Mount the local UI submodule directly into the Frappe apps directory
      - ./frappe-ai-ui:/home/frappe/frappe-bench/apps/frappe_ai
    networks:
      - frappe-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # 5. Second Frappe / ERPNext Bench (Multi-tenant verification)
  erpnext-2:
    image: docker.io/vyogo/erpnext:sne-version-16
    restart: unless-stopped
    ports:
      - "${ERPNEXT_2_PORT:-8002}:8000"
    environment:
      SITES: erpnext.local
      SITE_NAME: erpnext.local
      ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD:-admin}
      DEVELOPER_MODE: ${ERPNEXT_DEV_MODE:-1}
    volumes:
      - erpnext2_data:/home/frappe/frappe-bench/sites
      - erpnext2_logs:/home/frappe/frappe-bench/logs
      - ./frappe-ai-ui:/home/frappe/frappe-bench/apps/frappe_ai
    networks:
      - frappe-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  frappe-ai-network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  erpnext_data:
    driver: local
  erpnext_logs:
    driver: local
  erpnext2_data:
    driver: local
  erpnext2_logs:
    driver: local
