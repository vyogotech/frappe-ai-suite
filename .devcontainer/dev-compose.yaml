services:
  dev-env:
    # A complete dev container image supporting Node.js, Python, and Go
    image: mcr.microsoft.com/devcontainers/universal:2
    volumes:
      # Mount the root of the monorepo to the container workspace
      - ..:/workspace:cached
    # Overrides default command so things don't shut down after the process ends.
    command: /bin/sh -c "while sleep 1000; do :; done"
    networks:
      - frappe-ai-network
    # Link to the other services
    depends_on:
      - frappe-mcp-server
      - frappe-ai-agent
      - erpnext

  # Override MCP Server for live development
  frappe-mcp-server:
    image: golang:1.23-alpine
    working_dir: /app
    volumes:
      - ../frappe-mcp-server:/app:cached
    command: ["go", "run", "main.go"]

  # Override AI Agent for live development
  frappe-ai-agent:
    volumes:
      # Mount only the source code to avoid clobbering the container's .venv
      - ../frappe-ai-agent/src:/app/src:cached
    # Force live reload mode for uvicorn
    command: ["/bin/sh", "-c", "/app/.venv/bin/uvicorn ai_agent.app:create_app --factory --host 0.0.0.0 --port 8484 --reload"]
